[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dvrazer"
version = "0.5.0"
description = "A platform for analyzing instrumental data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "python-calamine",
    "xlrd>=2.0.1",
    "matplotlib",
    "jupyterlab",
    "scipy",
    "scikit-learn",
    "impedance",
]

[project.optional-dependencies]
dev = ["pytest"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# ---------------------------------------------------------------------------
# Agent bundle
# ---------------------------------------------------------------------------
# The repo keeps docs/, examples/ and skills/ at the top level so they stay
# browsable in the checkout.  The wheel additionally ships a copy of each under
# ``dvrazer/_bundle/`` so an agent that only has `pip install dvrazer` can find
# the docs, runnable examples and skills that match the installed version; see
# ``dvrazer.bundle_path()``.
[tool.hatch.build]
# ``.claude/skills/dvrazer`` is a tracked symlink to ``skills/dvrazer``.  The
# file walker de-duplicates directories by inode and would visit the symlink
# first, pruning the real ``skills/dvrazer`` from the distribution.  Excluding
# ``.claude`` up front (and not descending into it) keeps the real directory.
exclude = ["/.claude"]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["dvrazer"]
# Never shipped: bytecode, macOS metadata and generated plot images.  Hatchling
# skips ``__pycache__/`` and ``.DS_Store`` unconditionally, and the patterns
# below cover the rest of the project files.  They do not prune the forced
# directories above, so ``*.png`` is also gitignored: ``uv build`` builds the
# wheel from the sdist, whose file selection honours ``.gitignore``.
exclude = [
    "**/*.pyc",
    "**/.DS_Store",
    "**/*.png",
]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "dvrazer/_bundle/docs"
"examples" = "dvrazer/_bundle/examples"
"skills" = "dvrazer/_bundle/skills"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# The wheel build/install test does real work (a PEP 517 build plus a fresh
# virtual environment), so the default run deselects it.  A later ``-m`` on
# the command line replaces this one, hence ``uv run pytest -m slow`` runs
# exactly the slow tests.
addopts = ["-m", "not slow"]
markers = [
    "slow: tests that build and install a wheel (run with `uv run pytest -m slow`)",
]
